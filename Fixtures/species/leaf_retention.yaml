# Cypress broad-coverage leaf retention and family table (BUILD-PLAN.md section 8).
#
# One row per distinct DataSF qSpecies string that the seed database maps to a species
# (577 of them). This is the gating table for D5: leaf_retention drives every phenology
# surface, and an evergreen must never be offered a fall-colour chip or an autumn strip
# colour (DECISIONS section 3.14).
#
# Values are null wherever no source could be found. A null renders as "not known yet".
# Nothing here is written from recall; every non-null value carries a citation naming the
# source, the field, and the licence. See Fixtures/species/SOURCES.md.
#
# COVERAGE (denominator is all 198,435 rows of the DataSF Street Tree List snapshot in
# Fixtures/raw/street_tree_list.csv, vacant sites and placeholder strings included):
#   leaf_retention set for 511 of 577 species  =  182,782 rows  =  92.11%
#   family         set for 569 of 577 species  =  184,162 rows  =  92.81%
#   the 90% line is crossed at sf_rank 195 (Phoenix dactylifera)
#   ceiling: 13,773 rows (6.94%) are vacant sites or placeholder strings
#   ("Tree(s) ::", "::", empty) that map to no species at all, so 93.06% is the
#   most any species table can cover.
#
# match_method values that appear in leaf_retention citations:
#   selectree_name_exact          the DataSF string matched a SelecTree name outright
#   selectree_primary_taxon       matched SelecTree's parsed primary taxon
#   selectree_synonym_other_taxa  matched a synonym SelecTree itself lists in `other_taxa`
#   gbif_backbone_species_key     both names resolved to the same GBIF species key
#   fuzzy_name_edit_distance_N    DataSF misspelling, N character edits, single candidate
#   token_subset_of_"..."         every word of the DataSF string appears in one SelecTree name
#   *_species_level               matched at species level; the DataSF string names a cultivar
#
# generated: 2026-07-21
