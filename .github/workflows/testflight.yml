# Merge to main -> verified build -> TestFlight, with exactly one testable build left.
#
# The suite gates the upload, deliberately. This project's signature failure mode is a
# false green (docs/investigations/repeat-failures-postmortem.md), so the workflow judges
# every run with Tools/verify_test_log.sh and believes nothing else -- not an exit code,
# not a step that "succeeded". The two lines that count are `Test run with N tests passed`
# (Swift Testing) and `Executed N tests, with 0 failures` + `** TEST SUCCEEDED **` (XCTest).
#
# Expect ~35 minutes: the UI suite alone runs ~20. macOS runners are free on public repos.
name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. Two concurrent runs would race for the same build number and the
# loser's archive would be rejected as a duplicate.
concurrency:
  group: testflight
  cancel-in-progress: false

env:
  SCHEME: Cypress
  PROJECT: Cypress.xcodeproj
  BUNDLE_ID: app.cypress.Cypress
  SIMULATOR: iPhone 16 Pro

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ── Refuse an unusable toolchain in the first ten seconds ──────────────────────
      # Apple rejects uploads built with an SDK older than iOS 26. The first run of this
      # workflow discovered that FORTY MINUTES in, at the upload, having already run the
      # whole suite — the failure was knowable before a single test. So the check moved
      # here, and it fails loudly rather than leaving a 40-minute run to die at the end.
      # Selecting the newest installed Xcode rather than a hardcoded path, because a
      # pinned /Applications/Xcode_X.app vanishes with the next runner image bump.
      - name: Select the newest Xcode, and refuse an SDK too old to upload
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then
            echo "selecting $newest"
            sudo xcode-select -s "$newest/Contents/Developer"
          fi
          xcodebuild -version
          sdk="$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' | sort -n | tail -1)"
          echo "newest iOS SDK: $sdk"
          if [ -z "$sdk" ] || [ "$sdk" -lt 26 ]; then
            echo "::error::iOS SDK $sdk is too old. App Store Connect requires iOS 26 or"
            echo "::error::later. Installed Xcodes: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          xcrun simctl --version || true
          swift --version

      # ── The seed ───────────────────────────────────────────────────────────────────
      # ~103 MB, git-ignored, and mandatory: without it 13 tests fail on `seedURL -> nil`
      # and the app ships empty. Resolved from the published manifest and verified by
      # sha256 -- see Tools/fetch_seed.sh for why a fixed "latest" path is not safe.
      - name: Fetch and verify the seed
        run: bash Tools/fetch_seed.sh "$GITHUB_WORKSPACE"

      # ── The suite ──────────────────────────────────────────────────────────────────
      - name: Boot the simulator
        id: sim
        run: |
          set -euo pipefail
          # A CANDIDATE LIST, not one name: the runner image decides which simulators
          # exist, and it moves. macos-26 has no "iPhone 16 Pro" at all, which is how the
          # first macos-26 run died. Each name is matched with a trailing " (" so
          # "iPhone 17 Pro" cannot also match "iPhone 17 Pro Max" — a wider screen changes
          # what the UI suite sees, and run_tests.sh stamps screen-width-pt for exactly
          # that reason. Ordered by preference; the whole available list is printed either
          # way, so a future image bump is diagnosable from the log alone.
          echo "available devices:"
          xcrun simctl list devices available | grep -E "^\s+iPhone" || true
          udid=""
          for name in "iPhone 17 Pro" "iPhone 17" "iPhone 16 Pro" "iPhone 16"; do
            udid="$(xcrun simctl list devices available \
              | grep -F "$name (" \
              | head -1 \
              | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')"
            if [ -n "$udid" ]; then SIMULATOR="$name"; break; fi
          done
          [ -n "$udid" ] || { echo "::error::none of the candidate iPhone simulators exist on this image"; exit 1; }
          echo "using $SIMULATOR $udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # The unit suite hangs forever on a simulator that never granted camera access.
          xcrun simctl privacy "$udid" grant camera "$BUNDLE_ID" || true
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run the suite, and judge the log rather than the exit code
        run: |
          set -euo pipefail
          Tools/run_tests.sh "${{ steps.sim.outputs.udid }}" "$RUNNER_TEMP/ci.log" \
            -derivedDataPath "$RUNNER_TEMP/dd"
          Tools/verify_test_log.sh "$RUNNER_TEMP/ci.log"

      - name: Certify the zero-warning line
        run: Tools/verify_test_log.sh --warnings "$RUNNER_TEMP/ci.log"

      - name: Keep the log, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: ${{ runner.temp }}/ci.log
          if-no-files-found: warn

      # ── The build number ───────────────────────────────────────────────────────────
      # Asked of App Store Connect, never read from the repo. The committed
      # CURRENT_PROJECT_VERSION is 1 while App Store Connect already holds 3 (#196), so a
      # number taken from the project would be rejected as a duplicate. Passed to
      # xcodebuild as a setting override, which leaves project.pbxproj untouched --
      # CLAUDE.md forbids editing it, and this is why that costs nothing.
      - name: Ask App Store Connect for the next build number
        id: build_number
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # A venv, not `pip install` into the system Python: the runner's Homebrew Python
          # is externally managed and refuses under PEP 668. --break-system-packages would
          # also "work" and is the wrong trade — it risks the runner's own toolchain to
          # save one command.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography
          n="$("$RUNNER_TEMP/venv/bin/python" Tools/appstore_connect.py next-build-number)"
          echo "next build number: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      # ── Archive, export, upload ────────────────────────────────────────────────────
      # The API key does signing-asset management AND the upload, so no distribution
      # certificate or provisioning profile needs to live in a secret.
      - name: Write the API key where xcodebuild expects it
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          # printf, not echo: the key is multi-line PEM and echo mangles it.
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Cypress.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.n }} \
            | tail -40
          # The archive is the only place the shipped build number can be read back.
          plutil -extract ApplicationProperties.CFBundleVersion raw \
            "$RUNNER_TEMP/Cypress.xcarchive/Info.plist"

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Cypress.xcarchive" \
            -exportOptionsPlist Tools/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -30

      # ── One testable build, as asked ───────────────────────────────────────────────
      # Processing is asynchronous: the build is not in App Store Connect the moment the
      # upload returns. appstore_connect.py REFUSES to expire anything if it cannot find
      # the build it is meant to protect, so a slow processing run leaves the previous
      # build testable rather than leaving none at all.
      - name: Wait for processing, then expire every other build
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          n=${{ steps.build_number.outputs.n }}
          for i in $(seq 1 40); do
            if "$RUNNER_TEMP/venv/bin/python" Tools/appstore_connect.py expire-others "$n"; then exit 0; fi
            echo "build $n not visible yet (attempt $i/40); waiting 30s"
            sleep 30
          done
          echo "build $n never appeared in App Store Connect within 20 minutes."
          echo "The upload may still be processing. Nothing was expired."
          exit 1

      # ── What shipped ───────────────────────────────────────────────────────────────
      # #196: the repo could not previously answer this. A tag can.
      - name: Tag the commit that shipped
        run: |
          set -euo pipefail
          n=${{ steps.build_number.outputs.n }}
          git tag -a "build-$n" -m "TestFlight build $n from ${GITHUB_SHA}"
          git push origin "build-$n"
