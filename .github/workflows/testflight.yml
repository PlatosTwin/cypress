# Merge to main -> verified build -> TestFlight, with exactly one testable build left.
#
# The suite gates the upload, deliberately. This project's signature failure mode is a false green
# (docs/investigations/repeat-failures-postmortem.md), so every job judges its log with
# Tools/verify_test_log.sh and believes nothing else -- not an exit code, not a step that
# "succeeded". The two lines that count are `Test run with N tests passed` (Swift Testing) and
# `Executed N tests, with 0 failures` + `** TEST SUCCEEDED **` (XCTest).
#
# SHAPE, and why it is four jobs rather than one. Measured on run 30846300488: the whole thing took
# 50 minutes, of which the UI suite was 28.4 and everything else 21.6. One runner running one job
# could only ever be as fast as the sum. So the UI suite is split across runners -- separate
# machines, not separate simulators on one machine. That distinction is the whole design: a
# macos-26-arm64 runner has THREE cores, and run 30850154829 proved that a runner under load blows
# this suite's waits (#202). Cloning simulators onto one box would buy parallelism by re-creating
# the exact failure we just spent an evening diagnosing.
#
#   plan     ~10s   reads Tools/ui-test-shards.txt and decides how many UI jobs there are
#   unit     ~14m   the 1137-test Swift Testing suite, plus the zero-warning certification
#   ui       ~24m   N parallel jobs, one shard each; the longest shard sets the pace
#   release  ~10m   archive, upload, expire, tag -- only after unit AND every ui shard is green
#
# ~34 minutes wall clock for ~60 minutes of runner time, which is free on a public repo.
#
# THE FLOOR IS ONE CLASS. DeepLinkVoiceOverTests is 851.7s by itself -- 50% of the UI suite -- so
# no arrangement of whole classes gets below ~14 minutes. Splitting further means splitting by test
# method, a list that breaks silently on a rename. See Tools/ui-test-shards.txt.
name: TestFlight

on:
  push:
    branches: [main]
    # A DENY-list, not an allow-list, and that direction is the whole safety argument: anything
    # not named here still ships. A new source directory, a new resource, a new Tools script all
    # keep deploying without anyone remembering to add them — whereas an allow-list that missed a
    # path would silently stop shipping, which is the failure nobody notices until a tester asks
    # why the build is a week old.
    #
    # Safe because nothing under docs/ is a build input: the citation guard sweeps Cypress/,
    # CypressTests/ and CypressUITests/, and no test in the suite opens a file under docs/ at all
    # (checked, 2026-08-03). A docs-only commit therefore cannot break a test that this skip would
    # then hide.
    #
    # `*.md` matches only the repository root — `*` does not cross a `/` in these patterns — so
    # Fixtures/species/SOURCES.md still triggers a deploy. That is deliberate: it sits beside the
    # species YAML the seed is built from, and a file in a build input's directory gets the
    # benefit of the doubt.
    #
    # `.github/**` is deliberately NOT ignored. A change to this pipeline has to prove itself by
    # running, which is exactly how the SDK, the simulator name and the tag permission were each
    # caught.
    #
    # A push that touches BOTH docs and code still deploys: the skip needs every changed path to
    # match. And because a docs-only commit produces no run at all, the newest build can be behind
    # main — the `build-N` tag on the commit that shipped is what answers "what is in TestFlight".
    #
    # `graphify-out/**` is the knowledge-graph build product (9785d4f), and it is here for a
    # reason that would otherwise be invisible: its hook refreshes it on EVERY commit. Without
    # this line a docs-only commit also carries a graphify-out change, the skip needs every
    # changed path to match, and the docs rule above quietly stops working — a deploy per doc
    # edit, and nothing anywhere saying why. It is generated output ABOUT the code, read by
    # nothing in the app, the suite or the build.
    #
    # **`docs/whats-new/` is inside `docs/**` and there is no separate entry for it, deliberately.**
    # It holds the release notes (owner ruling 2026-08-21,
    # `docs/rulings-pending/testflight-changelog.md`): one sentence per pull request for
    # TestFlight's "What to Test", read by the `release` job and by nothing else — not the app, not
    # the suite, not the archive. Prose, in every sense this list means by the word, so `docs/**`
    # already covers it and a second entry would only be a second copy of the same fact.
    #
    # That containment is doing real work rather than saving a line. It is what makes a push
    # carrying ONLY a note — which is what a prose merge's optional note is — skip the run instead
    # of running the whole suite and then minting a build byte-identical to the last one, which is
    # #212 and #31 arriving through the very mechanism meant to describe builds. **The notes
    # directory must therefore stay under `docs/`.** `dist/whats-new/` was the first choice and is
    # unusable for a different reason worth recording: `/dist/` is git-ignored in full (publisher
    # output, `.gitignore`), so a note written there is never committed and the compile — which
    # reads git history and nothing else — would find nothing.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'graphify-out/**'

  # Since the beta lock (#206), main takes pull requests only, and `gate` is a REQUIRED status
  # check on it.
  #
  # **There is deliberately no `paths-ignore` here, and it must stay that way.** The deny-list above
  # is safe on `push` because a skipped run means only a skipped deploy. On `pull_request` it is a
  # deadlock: a docs-only PR would start no run, `gate` would never report, and the required check
  # would wait forever — a branch nobody can merge and no red anywhere saying why. That is strictly
  # worse than a wasted CI run, and it is not hypothetical; this trigger shipped with the ignores on
  # it and they were removed the same hour.
  #
  # The cost is real and accepted: a documentation-only PR runs the whole suite, about 26 minutes.
  # The saving is kept where it is free — merging a documentation-only PR deploys nothing, on
  # either base: on `main` the `push` deny-list above skips the merge commit's run, and on a
  # `release/**` branch there is no push-triggered run at all, because `push` below is deliberately
  # NOT extended to `release/**` (see the note just below) — it stays `main`-only.
  #
  # **`release/**` is on this trigger and not on `push`.** #217: a release round targets PRs at
  # `release/0.2` (and future `release/**` branches) instead of `main`, so without this a
  # release-targeted PR would start no run at all — no suite, no `gate` — and sit unmergeable with
  # no red anywhere saying why, the same failure shape as E225. `push` stays `main`-only on purpose:
  # the `release` job below is guarded only by `github.event_name != 'pull_request'` and the `ships`
  # predicate, never by branch name, so a push-triggered run on a release branch would mint a real
  # TestFlight build from a tree that has not been through review and has not landed on `main`.
  # Extending `push` to `release/**` would do exactly what the pull-request guard on `release`
  # exists to prevent.
  pull_request:
    branches: [main, 'release/**']

  workflow_dispatch:

# One release at a time. Two concurrent runs would race for the same build number and the
# loser's archive would be rejected as a duplicate.
#
# **Pull requests get their own group, one per branch.** With a single group a PR run would queue
# ahead of a deploy that was already waiting — `cancel-in-progress: false` means it waits its full
# turn — and a release would sit behind however many pull requests happened to be open. Only the
# release path needs the mutual exclusion, because only it takes a build number.
concurrency:
  group: >-
    testflight-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

# The tag step pushes, and the default GITHUB_TOKEN is read-only. Scoped to the one
# permission that needs raising rather than left at the workflow default.
permissions:
  contents: write

env:
  SCHEME: Cypress
  PROJECT: Cypress.xcodeproj
  BUNDLE_ID: app.cypress.Cypress
  # The width the release gate is certified at (#201). The runner image decides which simulator
  # exists, so without this the gate's screen can change with an image bump and nothing says so —
  # and this project has already filed two failures as a width defect that did not exist (#183).
  # A red run naming the new width is the point: accepting it is a decision, and this is where it
  # gets made.
  GATE_SCREEN_WIDTH_PT: "402"


jobs:
  # ── How many UI jobs? Ask the file, never a second list ───────────────────────────────
  # The matrix is DERIVED from Tools/ui-test-shards.txt rather than written beside it. A hardcoded
  # `shard: [1, 2, 3]` would be a second copy of the same fact, and the day someone adds a fourth
  # line without editing the matrix, that shard's tests stop running and every job stays green.
  # `UITestShardCoverageTests` already guarantees every class is on some line; this guarantees
  # every line gets a runner. Between them there is no way to add a UI test that silently never
  # runs.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.read.outputs.shards }}
      ships: ${{ steps.scope.outputs.ships }}
      tests: ${{ steps.scope.outputs.tests }}
      notes: ${{ steps.notes.outputs.state }}
    steps:
      # `fetch-depth: 0` because the ships decision below diffs against the previous tip, and a
      # shallow clone does not have it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        run: |
          set -euo pipefail
          n="$(grep -cvE '^[[:space:]]*(#|$)' Tools/ui-test-shards.txt || true)"
          [ "${n:-0}" -ge 1 ] || { echo "::error::Tools/ui-test-shards.txt names no shards"; exit 1; }
          echo "sharding the UI suite $n ways"
          echo "shards=$(seq 1 "$n" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

      # ── Does this push deserve a build number? ────────────────────────────────────────
      # A change to THIS FILE still runs the whole suite — "a change to the pipeline has to prove
      # itself by running" is why `.github/**` is not in the deny-list above, and it is how the wrong
      # SDK, the wrong simulator name and the tag permission were each caught. But running is not
      # shipping. Merging PR #1 minted build 12 whose app was byte-identical to build 11: a build
      # number consumed, build 11 expired, and every tester handed an update notification for an app
      # that had not changed.
      #
      # So: **skip the release only when EVERY changed path is one that cannot affect the built
      # app.** That set is the `paths-ignore` list above, plus `.github/`, plus the two test
      # directories, plus one named file under `Tools/` — the deny-list decides whether a run
      # happens, this decides whether that run mints a build, and for four of those the answers
      # deliberately differ.
      #
      # `CypressTests/` and `CypressUITests/` are here for `.github/`'s exact reason, and #215 is
      # the receipt: merging PR #4 changed one test file and one root .md and was minting build 13
      # when it was caught. A test change must RUN — it is the suite — and must not SHIP. That it
      # cannot ship is a fact about the scheme, not a judgement:
      # `Cypress.xcodeproj/xcshareddata/xcschemes/Cypress.xcscheme` has exactly one
      # `BuildActionEntry`, the `Cypress` app target, `buildForArchiving="YES"`. The test targets
      # are testables. Nothing under either directory is an archive input. If that ever changes —
      # a test target becomes an app dependency, a fixture gets bundled into the app — these two
      # tokens must come out, and `DeployPathsAgreeTests` names them so the deletion is deliberate.
      #
      # `Tools/ui-test-shards.txt` is here for the same reason and #31 is its receipt: build 16
      # (tag `build-16` at `cc9eefd`) was minted from PR #34, a six-file merge — four
      # `CypressUITests/` files, one `docs/errata-pending/` note, and the shard list. Five of those
      # six were already exempted from shipping by this same predicate; `Tools/ui-test-shards.txt`
      # was the one file that was not, and it alone made `ships=true` — the merge shipped an app
      # byte-identical to build 15. A build number consumed, build 15 expired, and every tester
      # handed an update notification for an app that had not changed. The file governs how the UI
      # job splits work across runners (`plan`'s `read` step above derives the matrix from it); it
      # is read by nothing the archive step touches, so it must RUN — a shard rebalance can still
      # break the suite — and must not SHIP. Named as the
      # single file rather than `Tools/` broadly: `Tools/build_seed.py` builds the seed database
      # that ships inside the app, and exempting all of `Tools/` from the ships predicate would
      # silence exactly the kind of change #212 and #215 exist to catch.
      #
      # Both halves are needed. `.github/` alone would still mint a build for a push that touched a
      # workflow AND a doc, which is the same byte-identical build under a rarer shape; the
      # `paths-ignore` list alone never sees such a push, because the presence of `.github/` is what
      # let it through the trigger.
      #
      # The direction matters and matches the deny-list argument above — anything this does not
      # recognize still ships, so a new source directory cannot silently stop reaching TestFlight.
      # It is a deny-list, not an allow-list.
      #
      # **`workflow_dispatch` always ships**, and that is the escape hatch that makes this safe. A
      # workflow change that genuinely needs a real archive to prove itself — signing, export
      # options, the upload step — is exactly the class this would otherwise leave unproven. Run the
      # workflow by hand and it releases.
      # ── Two questions, one list ───────────────────────────────────────────────────────
      # `tests`  — does anything here need the suite run at all?
      # `ships`  — having run, does this deserve a build number?
      #
      # They are different questions with a strict containment between them, and writing them as
      # one derivation rather than two literals is the point. `NO_ARCHIVE` extends `DOC_ONLY`;
      # nothing can be in the doc set without also being in the no-build set, so `ships=true`
      # always implies `tests=true` and the release job can never be reached by a run whose suite
      # did not execute. Two separate literals is exactly the shape that drifted within a day and
      # produced #215.
      - id: scope
        run: |
          set -euo pipefail

          # `DOC_ONLY` is the push trigger's `paths-ignore`, written as a regex: prose, and
          # nothing a test could exercise. `*` does not cross a `/` in those glob patterns, so
          # `*.md` is the repository root only and is anchored the same way here.
          DOC_ONLY='docs/|graphify-out/|[^/]*\.md$'
          # Plus the four that must RUN and must not SHIP. `.github/` because a pipeline change
          # proves itself by running (#212); the two test directories because they ARE the suite,
          # and cannot reach the archive — Cypress.xcscheme has one BuildActionEntry, the app
          # target (#215); `Tools/ui-test-shards.txt` (exact file, not `Tools/` broadly — see
          # above) because it only reshapes how the suite runs and build 16 shipped
          # byte-identical to build 15 when it slipped through (#31).
          NO_ARCHIVE="\.github/|CypressTests/|CypressUITests/|Tools/ui-test-shards\.txt$|$DOC_ONLY"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # The escape hatch: a manual run tests everything and ships. This is what makes the
            # skipping safe — a pipeline or test change that genuinely needs a real archive to
            # prove it (signing, export options, the upload step) is run by hand.
            echo "tests=true" >> "$GITHUB_OUTPUT"
            echo "ships=true" >> "$GITHUB_OUTPUT"
            echo "manual run — the suite runs and it ships"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # `github.sha` on a PR event is the MERGE commit, so base…merge is the PR's net diff.
            before="${{ github.event.pull_request.base.sha }}"
          else
            before="${{ github.event.before }}"
          fi
          # A brand-new branch, or a history GitHub cannot name, reports all-zeros. Fall back to the
          # merge's first parent, which for a merge commit IS the previous tip. Defaulting to
          # "run and ship" on any doubt is deliberate in both directions: a missed build is visible,
          # a surprise one is not — and an unrun suite is worse than either.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="$(git rev-parse HEAD^1 2>/dev/null || true)"
          fi
          if [ -z "$before" ]; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
            echo "ships=true" >> "$GITHUB_OUTPUT"
            echo "::notice::could not determine the previous tip — running and shipping rather than guessing"
            exit 0
          fi

          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          echo "changed paths:"; echo "$changed" | sed 's/^/  /'

          testable="$(printf '%s\n' "$changed" | grep -vE "^($DOC_ONLY)" || true)"
          buildable="$(printf '%s\n' "$changed" | grep -vE "^($NO_ARCHIVE)" || true)"

          if [ -z "$changed" ] || [ -z "$testable" ]; then
            echo "tests=false" >> "$GITHUB_OUTPUT"
            echo "ships=false" >> "$GITHUB_OUTPUT"
            # No backticks in this string, and that is not a style preference. It is a DOUBLE-quoted
            # shell string, so `word` is command substitution: written with them, the shell ran
            # `gate` as a command, got nothing, and silently deleted the word from the notice a
            # reader sees. Harmless with that word; arbitrary execution with a different one.
            echo "::notice::only prose changed (docs/, graphify-out/ or a root *.md), so no test can exercise it and no build is minted. The suite is skipped deliberately, and the gate job checks that it was skipped for this reason. Run this workflow manually (workflow_dispatch) to force a full run."
            exit 0
          fi

          echo "tests=true" >> "$GITHUB_OUTPUT"
          echo "the suite runs — these are not prose:"; echo "$testable" | sed 's/^/  /'

          if [ -z "$buildable" ]; then
            echo "ships=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nothing changed that can affect the built app (only .github/, CypressTests/, CypressUITests/, Tools/ui-test-shards.txt, docs/, graphify-out/ or a root *.md), so the suite runs but no build is minted — it would be byte-identical to the last one. Run this workflow manually (workflow_dispatch) if a pipeline or test change needs a real archive to prove it: signing, export options, or the upload step."
          else
            echo "ships=true" >> "$GITHUB_OUTPUT"
            echo "shipping — these can affect the app:"; echo "$buildable" | sed 's/^/  /'
          fi

      # ── Does this pull request carry its release note? ────────────────────────────────
      # Owner ruling, 2026-08-21: every TestFlight build ships a changelog, compiled from one
      # tester-voice line per pull request, and CI refuses a code change that does not carry one.
      # `docs/rulings-pending/testflight-changelog.md` has the ruling and the mechanism;
      # `docs/whats-new/README.md` is what an author reads.
      #
      # **This step never fails the job, and that is deliberate.** `plan` dying takes `unit`, `ui`
      # and `release` with it, and `gate` — reading a failed plan — would report "plan did not
      # succeed", burying the one sentence the author needs. So the decision is published as an
      # output, `gate` refuses on it, and the `::error::` below puts the instruction on the run's
      # own summary page where it is the first thing visible. The suite still runs; an author gets
      # the missing note and the test result in one round rather than two.
      #
      # **Pull requests only.** The check belongs where the required status check is. On a push it
      # would be arguing with a merge that already happened, and on `workflow_dispatch` there is no
      # diff to read — a manual run has no base. Both set `not-required`, which `gate` accepts and
      # an unset value is not.
      #
      # `tests == 'true'` is the trigger, not `ships`: "a non-prose change" is the ruling's own
      # scope. A test-only or workflow-only pull request runs the suite, mints no build, and still
      # has to say what a tester will see — which for those is `internal:`, and saying so in the
      # diff is the point of the escape hatch rather than a loophole in it.
      - id: notes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "state=not-required" >> "$GITHUB_OUTPUT"
            echo "not a pull request — the release note is checked where the required status check is"
            exit 0
          fi
          if [ "${{ steps.scope.outputs.tests }}" != "true" ]; then
            echo "state=not-required" >> "$GITHUB_OUTPUT"
            echo "prose-only change — no build is minted, so no release note is required (one is welcome anyway; it waits in docs/whats-new/ for the next build)"
            exit 0
          fi
          # A branch name may contain slashes; a note filename must not, or the suggestion would
          # name a subdirectory of the notes directory. Read from the environment (see this step's
          # `env:`) rather than interpolated into the script — a branch name is attacker-
          # controllable text, and a GitHub expression splices it into the shell SOURCE before the
          # shell ever sees a quote. Note also that GitHub interpolates expressions anywhere in a
          # `run:` block, comments included, so one written out here as an example would be
          # evaluated; an empty one fails the whole file's validation and no checks appear at all.
          suggestion="docs/whats-new/${HEAD_REF//\//-}.md"
          # `github.sha` on a pull_request event is the MERGE commit, so base…merge is the net
          # diff — the same pair `scope` reads above, and for the same reason.
          if python3 Tools/whats_new.py check \
               --base "${{ github.event.pull_request.base.sha }}" \
               --head "${{ github.sha }}" \
               --example "${suggestion#docs/whats-new/}"; then
            echo "state=ok" >> "$GITHUB_OUTPUT"
          else
            echo "state=missing" >> "$GITHUB_OUTPUT"
            # One line, because an annotation is one line. The full instructions are in this step's
            # log immediately above, printed by whats_new.py itself.
            echo "::error::This change needs a release note. Add ${suggestion} containing one sentence a tester would read — for example \"You can now pinch to zoom a tree's photos.\" If nothing here is tester-visible, write \"internal: <why>\" instead. See docs/whats-new/README.md, and this job's log for the full message."
          fi

  # ── The unit suite, and the only place warnings are certified ─────────────────────────
  # Skipped when `plan` says nothing but prose changed. `gate` does not simply accept a skipped
  # job — it asserts the skip matches plan's decision, so this cannot go quietly missing.
  unit:
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        id: prep

      - name: Run the unit suite, and judge the log rather than the exit code
        run: |
          set -euo pipefail
          Tools/run_tests.sh "${{ steps.prep.outputs.udid }}" "$RUNNER_TEMP/unit.log" \
            -only-testing:CypressTests \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/dd"
          Tools/verify_test_log.sh "$RUNNER_TEMP/unit.log"

      # Certified here and nowhere else. A fresh DerivedData is what makes the count mean
      # anything (E203) and this job is the one that builds into one; the UI shards would each
      # re-certify the same number from the same source for no added confidence.
      - name: Certify the zero-warning line
        run: Tools/verify_test_log.sh --warnings "$RUNNER_TEMP/unit.log"

      # `retention-days` is stated rather than left at the repository default of 90 (task #71).
      # Thirty days for the text logs and not fourteen: an errata entry cites the run it was
      # written from, and a citation whose artifact expires before the next reader follows it is
      # worse than a long retention (#71 review, N10). Thirty outlives a review round and still
      # falls short of the two-month-old log somebody mistakes for a fresh one — which the
      # CYPRESS-RUN header is the real defence against. The 110 MB result bundles below keep the
      # shorter life, because size is the thing worth rationing.
      - name: Keep the log, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-log
          path: ${{ runner.temp }}/unit.log
          if-no-files-found: warn
          retention-days: 30

      # The result bundle only on failure. It carries what the text log cannot — per-test
      # timings, attachments, each failure's own source location — and it is tens of megabytes,
      # so a green run has no reason to pay for the upload. `ignore`, not `warn`: a job that
      # fails in `prepare`, before xcodebuild runs at all, has no bundle to keep and that is not
      # a thing to warn about.
      - name: Keep the result bundle when the suite went red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-xcresult
          path: ${{ runner.temp }}/unit.xcresult
          if-no-files-found: ignore
          retention-days: 14

  # ── The UI suite, one shard per runner ────────────────────────────────────────────────
  ui:
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      # A red shard must not cancel its siblings. The point of a release gate is to learn
      # everything that is wrong in one run, and cancelling turns three findings into one.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        id: prep

      - name: Run UI shard ${{ matrix.shard }}
        run: |
          set -euo pipefail
          line="$(grep -vE '^[[:space:]]*(#|$)' Tools/ui-test-shards.txt | sed -n "${{ matrix.shard }}p")"
          # Cannot happen while the matrix comes from this same file — asserted anyway, because
          # an empty argument list makes xcodebuild run the WHOLE suite, and a shard that
          # quietly ran everything would look like a pass while taking 28 minutes.
          [ -n "$line" ] || { echo "::error::shard ${{ matrix.shard }} has no line in Tools/ui-test-shards.txt"; exit 1; }
          # Split on newlines from `tr`, NOT on the shell's word splitting. `for class in $line`
          # reads correctly in bash and produces ONE argument in zsh, which does not word-split
          # unquoted expansions — so the same line yields four -only-testing: flags on the runner
          # and one malformed flag when a maintainer dry-runs it locally. That divergence is how
          # CLAUDE.md's `grep [x]codebuild` check came to pass vacuously; this one behaves the same
          # everywhere.
          args=()
          while IFS= read -r class; do
            [ -n "$class" ] || continue
            args+=("-only-testing:CypressUITests/$class")
          # `printf '%s\n'`, not `printf '%s'`: without the trailing newline `read` returns false
          # on the last field and the loop discards it, so every shard silently drops its final
          # class — 11 of 14 classes ran when this was first written, and all three jobs were
          # green. The count assertion below is what turns that into a red rather than a quiet
          # gap in coverage.
          done < <(printf '%s\n' "$line" | tr ' ' '\n')
          # An empty list makes xcodebuild run the WHOLE suite: a shard that quietly ran
          # everything would pass while taking 28 minutes and telling nobody why.
          [ "${#args[@]}" -ge 1 ] || { echo "::error::shard ${{ matrix.shard }} parsed to no test classes"; exit 1; }
          echo "shard ${{ matrix.shard }} runs ${#args[@]} class(es): $line"
          Tools/run_tests.sh "${{ steps.prep.outputs.udid }}" "$RUNNER_TEMP/ui-${{ matrix.shard }}.log" \
            "${args[@]}" \
            -resultBundlePath "$RUNNER_TEMP/ui-${{ matrix.shard }}.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/dd"
          Tools/verify_test_log.sh --expect-width "$GATE_SCREEN_WIDTH_PT" \
            "$RUNNER_TEMP/ui-${{ matrix.shard }}.log"

      - name: Keep the log, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 30

      # See the unit job's copy of this step for why the bundle is failure-only.
      - name: Keep the result bundle when the shard went red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-xcresult-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-${{ matrix.shard }}.xcresult
          if-no-files-found: ignore
          retention-days: 14

  # ── One stable context for the branch ruleset to require ──────────────────────────────
  # The UI matrix's check contexts are named "ui (1)"…"ui (N)", and N is DERIVED from
  # Tools/ui-test-shards.txt. Requiring those by name would break the day somebody adds a shard
  # line — and break it as a branch nobody can merge, waiting on a context that will never report,
  # which is a far worse failure than a red test. This job's name never changes.
  #
  # `if: always()` is load-bearing. Without it a failed `unit` or `ui` SKIPS this job, and GitHub
  # does not treat a skipped required check as a failed one — the branch would go mergeable
  # precisely when the suite went red. So it always runs, and reads the results itself.
  #
  # Since the suite can now be skipped ON PURPOSE for a prose-only change, this job is the only
  # thing standing between that optimization and a check that goes green without testing anything.
  # It does not accept a skip; it accepts a skip that MATCHES plan's decision.
  gate:
    needs: [plan, unit, ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse unless the suite did what plan said it should
        run: |
          set -euo pipefail
          plan_result="${{ needs.plan.result }}"
          tests="${{ needs.plan.outputs.tests }}"
          notes="${{ needs.plan.outputs.notes }}"
          unit="${{ needs.unit.result }}"
          ui="${{ needs.ui.result }}"
          echo "plan:  $plan_result (tests=${tests:-<none>}, notes=${notes:-<none>})"
          echo "unit:  $unit"
          echo "ui:    $ui"

          # **plan is checked FIRST, and the order is the whole safety argument.** If plan dies,
          # `tests` is the empty string — which is not 'true', so unit and ui skip, and the
          # prose-only branch below would find two skipped jobs exactly where it expects them and
          # pass. A required check going green because the job that decides everything crashed is
          # precisely the false green this file exists to prevent.
          [ "$plan_result" = "success" ] \
            || { echo "::error::plan did not succeed ($plan_result) — nothing below can be trusted"; exit 1; }
          case "$tests" in
            true|false) ;;
            *) echo "::error::plan succeeded but published tests='${tests}' — expected true or false"; exit 1 ;;
          esac

          if [ "$tests" = "true" ]; then
            # Explicit equality, not `!= failure`: a cancelled or skipped dependency is also not a
            # pass, and "did not fail" would let both through.
            [ "$unit" = "success" ] || { echo "::error::unit did not succeed ($unit)"; exit 1; }
            [ "$ui" = "success" ] || { echo "::error::ui did not succeed ($ui)"; exit 1; }
            echo "every test job succeeded"
          else
            # Equally explicit in the other direction. plan said no test could exercise this diff,
            # so the two jobs must be *skipped* — not failed, not cancelled, and not succeeded
            # either, because a success here would mean the `if:` conditions and this branch
            # disagree about what ran.
            [ "$unit" = "skipped" ] \
              || { echo "::error::plan said tests=false but unit is '$unit', not 'skipped'"; exit 1; }
            [ "$ui" = "skipped" ] \
              || { echo "::error::plan said tests=false but ui is '$ui', not 'skipped'"; exit 1; }
            echo "prose-only change: the suite was skipped, and skipped for that reason"
          fi

          # ── The release note ────────────────────────────────────────────────────────────
          # Owner ruling, 2026-08-21: a code change cannot merge without one tester-voice line
          # for TestFlight's "What to Test". `plan`'s `notes` step decides; this is where the
          # decision is enforced, because this is the required status check.
          #
          # The `case` is not decoration. `needs.plan.outputs.notes` is the EMPTY STRING when the
          # step did not run, was renamed, or crashed before writing its output — and an empty
          # string is not 'missing', so a bare `[ "$notes" != "missing" ]` would report success
          # exactly when the check stopped working. That is the same shape as the `tests` guard
          # above and the same shape as every false green this file exists to prevent.
          case "$notes" in
            ok|missing|not-required) ;;
            *) echo "::error::plan succeeded but published notes='${notes}' — expected ok, missing or not-required. The release-note check did not run, so nothing here knows whether this change carries its line."; exit 1 ;;
          esac
          if [ "$notes" = "missing" ]; then
            echo "::error::This change needs a release note under docs/whats-new/ — see the 'plan' job's log for the exact file to add, and docs/whats-new/README.md for the rules. If nothing here is tester-visible, a line reading 'internal: <why>' satisfies this."
            exit 1
          fi
          echo "release note: $notes"

  # ── Archive, upload, leave exactly one testable build ─────────────────────────────────
  # `needs` both, so a red anywhere stops the upload. GitHub skips a needs-job when any dependency
  # fails, and a skipped job is not a passed job — nothing here has to re-check that the tests were
  # green, because it does not run otherwise.
  release:
    needs: [plan, unit, ui]
    # **A pull request must never ship a build.** It would take a build number, expire the build
    # the testers are on, and do it from code that has not landed on main.
    #
    # **And a `.github/`-only push must not either** — see `plan`'s `scope` step for the whole
    # argument. `needs: plan` is here for that output; the shard matrix was already depending on it
    # through `ui`.
    #
    # Nothing extra is needed for the skipped-suite case, and that is a property of the derivation
    # rather than luck: `NO_ARCHIVE` strictly contains `DOC_ONLY`, so `ships=true` implies
    # `tests=true`, and a run whose suite was skipped can never satisfy this condition. Belt and
    # braces anyway — `needs: [unit, ui]` means GitHub skips this job outright when they skip.
    if: github.event_name != 'pull_request' && needs.plan.outputs.ships == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Not the secrets — a boolean derived from them, for the two `if:`s on the certificate
      # steps below. They cannot read `secrets` directly: the workflow parser does not accept
      # `secrets` as a named value inside a step-level `if:`, and the failure mode is total —
      # the whole FILE fails validation, no jobs run, and no checks appear on the PR (run
      # 31017859507, "Unrecognized named-value: 'secrets'"). `env:` values ARE allowed to read
      # secrets, and deriving `true`/`false` here keeps the secret values themselves out of
      # every step's environment except the import step's own `env:` block.
      HAS_PERSISTED_CERT: ${{ secrets.DIST_CERT_P12 != '' && secrets.DIST_CERT_P12_PASSWORD != '' }}
    steps:
      # `fetch-depth: 0` — and it is the release notes that need it, not the archive. The notes
      # for this build are "every note file added since the commit the LAST build shipped from",
      # and the tag naming that commit is only present in a full clone. A shallow one would make
      # `whats_new.py compile` refuse (loudly, by design) rather than silently re-ship the whole
      # history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No simulator: this job archives for a device and never runs a test. Booting one costs
      # 2.5 minutes to sit idle.
      - uses: ./.github/actions/prepare
        with:
          boot-simulator: "false"

      # ── What this build tells its testers ────────────────────────────────────────────
      # Compiled FIRST, published last. Two reasons, and both are about ordering rather than
      # convenience:
      #
      #   1. The boundary is the previous build's tag, and this job creates the NEXT one at the
      #      end. Compiling after "Tag the commit that shipped" would diff `build-N` against
      #      HEAD — the same commit — and every build would ship an empty changelog. Reading the
      #      tag before anything else makes that impossible rather than merely unlikely.
      #   2. A malformed note fails here, in ten seconds, instead of after a forty-minute archive.
      #
      # The compiled text is echoed into the job log, so the run itself records what the testers
      # were told — a claim about a build that outlives the App Store Connect UI's own history.
      - name: Compile the release notes
        id: whats_new
        run: |
          set -euo pipefail
          since="$(python3 Tools/whats_new.py latest-build-tag)"
          if [ -z "$since" ]; then
            echo "::warning::no build-N tag in this repository, so every note ever written counts as unshipped. Expected exactly once, on the first build after this mechanism landed."
          else
            echo "the last build shipped from $since ($(git rev-parse --short "$since"))"
          fi
          # stdout silenced, and the file printed below instead: `compile` writes the notes to
          # both, and a release log that shows the same five lines twice is a log somebody skims.
          # The commentary — which notes were found, which were internal, how many characters —
          # goes to stderr and is kept.
          python3 Tools/whats_new.py compile \
            --since "$since" --at "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/whats-new.txt" > /dev/null
          echo "── what TestFlight will show ──────────────────────────────"
          cat "$RUNNER_TEMP/whats-new.txt"
          echo ""
          echo "───────────────────────────────────────────────────────────"

      # ── The build number ─────────────────────────────────────────────────────────────
      # Asked of App Store Connect, never read from the repo. The committed
      # CURRENT_PROJECT_VERSION is 1 while App Store Connect already holds 4 (#196), so a number
      # taken from the project would be rejected as a duplicate. Passed to xcodebuild as a setting
      # override, which leaves project.pbxproj untouched — CLAUDE.md forbids editing it, and this
      # is why that costs nothing.
      - name: Ask App Store Connect for the next build number
        id: build_number
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # A venv, not `pip install` into the system Python: the runner's Homebrew Python is
          # externally managed and refuses under PEP 668. --break-system-packages would also
          # "work" and is the wrong trade — it risks the runner's own toolchain to save one
          # command.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography
          n="$("$RUNNER_TEMP/venv/bin/python" Tools/appstore_connect.py next-build-number)"
          echo "next build number: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      # The API key does signing-asset management AND the upload, so no distribution certificate
      # or provisioning profile needs to live in a secret.
      - name: Write the API key where xcodebuild expects it
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          # printf, not echo: the key is multi-line PEM and echo mangles it.
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # ── Import the persisted signing certificate, if one exists ─────────────────────────
      # The persisted certificate must be type **Apple Distribution** — Tools/ExportOptions.plist
      # exports with the app-store-connect method, which no other certificate type satisfies
      # (PR #26 review). A wrong-type p12 imports without complaint and fails only at Archive.
      #
      # #232: without this, `-allowProvisioningUpdates` on the Archive step below finds a
      # keychain with no signing identity and mints a BRAND NEW Apple distribution certificate
      # through the API, every single deploy. That certificate's private key is generated on the
      # runner and dies with it, so nothing is ever reused — twelve deploys accumulated to
      # Apple's per-account certificate cap and blocked a release outright (the surplus certs
      # were just revoked by hand). Importing one persisted certificate here means every run
      # reuses the same identity and stops minting new ones.
      #
      # `-allowProvisioningUpdates` STAYS on both xcodebuild calls below, and that is deliberate.
      # It does two things: refreshes the provisioning profile, and creates a signing certificate
      # when the keychain has none. Profiles are regenerable and uncapped, so that half is
      # harmless and still needed — only the certificate-creation half is the problem, and it
      # only fires when the keychain is empty. Importing a certificate here removes the "keychain
      # is empty" condition without touching the flag that also does useful work.
      #
      # ── The guard is a step-level `if:` on HAS_PERSISTED_CERT, not an in-script check ───
      # A step-level `if:` is evaluated by the Actions runtime before anything in `run:` starts —
      # when the secrets are unset, the shell below never runs, so the (empty, in that case)
      # secret value never enters a process environment that a stray `set -x`, an accidental
      # `env` dump, or a future edit to this script could echo. An in-script `[ -z "$VAR" ]` check
      # needs the secret exported into the step's environment on every run, including the skip
      # case, just to be tested — strictly more surface for the identical decision. The `if:`
      # tests the job-level boolean rather than the secrets themselves for the parser reason
      # documented at that boolean's definition. When the secrets are unset this degrades
      # cleanly: the step below does not run at all, and the fallback step under it logs why,
      # once, without touching either secret.
      - name: Import the signing certificate
        id: import_cert
        if: env.HAS_PERSISTED_CERT == 'true'
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_P12_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/dist_signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"

          # The secret is the base64 TEXT of a binary p12. Decoding explicitly (rather than
          # trusting xcodebuild to do it) fails loudly on truncated input instead of silently
          # importing a corrupt certificate.
          echo "$DIST_CERT_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 6 hours: comfortably longer than this job's 45-minute timeout, so the keychain never
          # auto-locks mid-archive.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # -T /usr/bin/codesign, not -A: trust codesign specifically for this identity rather
          # than every application on the runner.
          security import "$CERT_PATH" -P "$DIST_CERT_P12_PASSWORD" -T /usr/bin/codesign \
            -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Replaces the search list with just this keychain. The runner's default keychain has
          # no identity xcodebuild needs, and an empty search list is why Archive minted a new
          # certificate in the first place.
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          # Lets codesign use the imported key without an interactive keychain prompt, which
          # would otherwise hang the job forever on a headless runner.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # What identity actually arrived, logged at import time. A revoked or wrong-type
          # certificate imports "successfully" here and fails only minutes later inside Archive's
          # tail -40, where the cause is hardest to read — this line is the audit trail that says
          # whether the identity was ever valid on this runner (PR #26 review).
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "imported the persisted distribution certificate"

      - name: Note that no persisted certificate is configured
        if: env.HAS_PERSISTED_CERT != 'true'
        run: |
          echo "::notice::DIST_CERT_P12/DIST_CERT_P12_PASSWORD not set — signing falls back to xcodebuild's on-demand certificate creation (#232). Add both secrets to stop new certificates from being minted on every deploy."

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The marketing version comes from the VERSION file at the repo root, the same way the
          # build number comes from App Store Connect: as a setting override, because the number
          # committed in project.pbxproj (0.1, six configurations) cannot be edited — the tree is
          # a PBXFileSystemSynchronizedRootGroup and hand-edits are forbidden (CLAUDE.md). Before
          # this override existed, every build shipped as 0.1 regardless of intent: the release/0.2
          # branch name encoded a version no step ever read.
          #
          # Two checks, not one, because each catches what the other cannot (PR #28 review): a
          # two-line file ("0.2" then "0.3") concatenates under a bare whitespace-strip into
          # "0.20.3", which is a VALID semantic version — the line count is the only thing that
          # rejects it. The format check then rejects everything that is one line but not a
          # version.
          [ "$(grep -c . VERSION)" -eq 1 ] || { echo "VERSION file must contain exactly one non-empty line" >&2; exit 1; }
          MARKETING_VERSION="$(tr -d '[:space:]' < VERSION)"
          printf '%s' "$MARKETING_VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "VERSION file does not hold a plain semantic version: '$MARKETING_VERSION'" >&2; exit 1; }
          echo "marketing version from VERSION file: $MARKETING_VERSION"
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Cypress.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.n }} \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tail -40
          # The archive is deliberately UNSIGNED; the Export step below performs the one real
          # signing pass, and the ad-hoc signing step in between is what carries the
          # entitlements across that gap — read it before touching either signing flag here.
          # Both alternatives were run before this landed, not reasoned about:
          # run 31052462134 proved that under automatic signing `archive` demands an Apple
          # DEVELOPMENT identity (`No signing certificate "iOS Development" found`, on a
          # keychain verifiably holding the imported Distribution identity) — which also names
          # what the pre-#232 per-deploy minting created: Development certificates, one per
          # empty keychain. And run 31054628357 proved the tempting one-line alternative,
          # CODE_SIGN_IDENTITY="Apple Distribution" here, is rejected by the automatic-signing
          # engine ("conflicting provisioning settings"), exactly as PR #31's review predicted
          # from the documentation. Export signs with the imported Distribution identity and
          # the ASC API key resolves the profile, so nothing is left to mint anywhere.
          # The archive is the only place the shipped numbers can be read back. Both are read,
          # because both were overridden above — a readback that skips the version would leave the
          # override unverified, which is how 0.1 shipped silently for a full round.
          plutil -extract ApplicationProperties.CFBundleVersion raw \
            "$RUNNER_TEMP/Cypress.xcarchive/Info.plist"
          SHIPPED_VERSION="$(plutil -extract ApplicationProperties.CFBundleShortVersionString raw \
            "$RUNNER_TEMP/Cypress.xcarchive/Info.plist")"
          echo "archive carries marketing version: $SHIPPED_VERSION"
          [ "$SHIPPED_VERSION" = "$MARKETING_VERSION" ] || { echo "archive version $SHIPPED_VERSION does not match VERSION file $MARKETING_VERSION — the override did not take" >&2; exit 1; }

      # ── Sign the archive ad hoc, so the product requests its entitlements ────────────
      # Export builds the final signature from what the archived app's signature REQUESTS,
      # never from the Xcode project — CODE_SIGN_ENTITLEMENTS is processed at archive-time
      # signing, which CODE_SIGNING_ALLOWED=NO above deliberately skips. That gap is how
      # builds 34 and 35 shipped without com.apple.developer.applesignin: the export re-signed
      # the unsigned archive with baseline entitlements only (application-identifier,
      # team-identifier, get-task-allow), every step green, and Sign in with Apple failed
      # instantly on device. Both directions were run locally before this landed (2026-08-15,
      # same commit, same export options): an unsigned archive exports with the entitlement
      # ABSENT from the signature even though the embedded profile authorizes it, and an
      # ad-hoc-signed archive exports with it PRESENT.
      #
      # Ad hoc (`-s -`) because it needs no certificate, no profile and no secret, and the
      # export replaces it wholesale with the real Apple Distribution signature — its only job
      # is to carry the entitlements request across the archive-to-export gap. Signing at
      # archive time instead was tried and refused: manual style with CODE_SIGN_IDENTITY=-
      # fails on `"Cypress" requires a provisioning profile`, with or without
      # AD_HOC_CODE_SIGNING_ALLOWED=YES and PROVISIONING_PROFILE_REQUIRED=NO (2026-08-15).
      - name: Sign the archive ad hoc, with the app's declared entitlements
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Cypress.xcarchive/Products/Applications/Cypress.app"
          codesign --force -s - --entitlements Cypress/Cypress.entitlements "$APP"
          # Readback, for the log's provenance: what does the archive's signature now request?
          codesign -d --entitlements "$RUNNER_TEMP/archive-entitlements.plist" --xml "$APP"
          cat "$RUNNER_TEMP/archive-entitlements.plist"; echo

      # `destination = export` in Tools/ExportOptions.plist: the signed .ipa lands on disk so
      # the guard below can inspect the exact bytes that will be uploaded. With `upload`, the
      # final product existed only inside xcodebuild and nothing could look at it before
      # TestFlight — which is how builds 34 and 35 went out missing their entitlements with
      # every check green.
      - name: Export the signed .ipa
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Cypress.xcarchive" \
            -exportOptionsPlist Tools/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -30

      # ── Keep the dSYMs, whatever happens downstream ──────────────────────────────────
      # The shipped binary is stripped, the archive's dSYM (same UUID) is the only thing that
      # can symbolicate it, the exported .ipa does not carry it, and the runner is destroyed
      # at job end — so without this, a failed symbol upload is discovered on the first crash
      # report and is unrecoverable by then (PR #89 review). `error`, not `warn`: an archive
      # with no dSYMs means nothing anywhere can ever symbolicate this build.
      - name: Keep the dSYMs, so a crash report can always be symbolicated
        uses: actions/upload-artifact@v4
        with:
          name: dSYMs-build-${{ steps.build_number.outputs.n }}
          path: ${{ runner.temp }}/Cypress.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 30

      # ── Refuse to upload a product that lost an entitlement ──────────────────────────
      # The guard this pipeline was missing when builds 34 and 35 shipped. It fails the job
      # BEFORE the upload if any entitlement declared in Cypress/Cypress.entitlements is
      # absent from the product's signature (what iOS enforces) or carried with the wrong
      # value, or unauthorized by the embedded profile's Entitlements dict (what the store
      # accepts). The required list is DERIVED from the declared file, never copied — see
      # Tools/verify_entitlements.sh for the derivation and the calibration evidence. On the
      # profile side its failure message names the one portal action, for the day the
      # cloud-managed distribution profile predates a new capability and
      # -allowProvisioningUpdates does not regenerate it.
      #
      # The `ls -R` answers a question no local experiment could: whether an
      # app-store-connect export writes a Symbols/ directory beside the .ipa (the dev-method
      # export skips IDEDistributionSymbolsStep, so it could not say). The first real run's
      # log settles it permanently.
      - name: Refuse to upload a product missing a required entitlement
        run: |
          set -euo pipefail
          # `|| true` on the ls as well as the find below: an `ls` of a missing export
          # directory would otherwise kill the step under `set -e` one line before the
          # find whose failure the ::error:: annotation exists to explain (PR #89 review,
          # round 3 — the round-1 finding reintroduced one line above its own fix).
          ls -R "$RUNNER_TEMP/export" || true
          # `|| true` because under `set -e` a failing $(find) aborts the step on the
          # assignment itself, and the ::error:: annotation on the next line never renders.
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit || true)"
          [ -n "$IPA" ] || { echo "::error::the export produced no .ipa under $RUNNER_TEMP/export"; exit 1; }
          Tools/verify_entitlements.sh "$IPA" Cypress/Cypress.entitlements

      # The same bytes the guard just inspected, uploaded by altool with the same API key the
      # export used. The key file is already at $RUNNER_TEMP/private_keys/AuthKey_<id>.p8,
      # which is exactly the layout altool's $API_PRIVATE_KEYS_DIR lookup expects.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          set -euo pipefail
          # `|| true` for the same reason as the guard step above.
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit || true)"
          [ -n "$IPA" ] || { echo "::error::no .ipa to upload under $RUNNER_TEMP/export"; exit 1; }
          xcrun altool --upload-app -f "$IPA" -t ios \
            --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID"

      # ── What shipped ─────────────────────────────────────────────────────────────────
      # #196: the repo could not previously answer this. A tag can — and it matters more now that
      # docs-only commits do not deploy, so main can be ahead of the newest build.
      #
      # **This step used to be the last one in the job, and moving it up here is deliberate.** The
      # upload is the moment the commit ships; everything after it is bookkeeping against a build
      # that already exists. Left at the end, a slow processing run — which fails the expiry step
      # below after twenty minutes — would ship a build and record no tag for it, and two things
      # would be untrue at once: `build-N` would not say what shipped, and the release-note
      # backstop, which compiles a build's notes from `build-N` and `build-(N-1)`, would have
      # nothing to read for exactly the build that needs it most. Tagging here costs nothing and
      # removes both. Nothing later in the job reads the tag — "Compile the release notes" reads
      # the PREVIOUS one, and does so before the archive even starts.
      #
      # Created through the API rather than `git push origin build-N`. A push whose ref carries a
      # change to `.github/workflows/**` is rejected for a GitHub App token without `workflows`
      # permission — and since this pipeline's own commits edit this file, tagging them failed with
      #
      #   ! [remote rejected] build-5 -> build-5 (refusing to allow a GitHub App to create or
      #     update workflow `.github/workflows/testflight.yml` without `workflows` permission)
      #
      # The obvious fix is to grant `workflows: write`, and it is the wrong one: it would let any
      # step in this job rewrite the pipeline that gates releases, to remove a check the size of
      # the whole test suite. GitHub gates that deliberately. Creating a ref through the API
      # changes no file — the commit is already on main — so it needs no such grant.
      - name: Tag the commit that shipped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n=${{ steps.build_number.outputs.n }}
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
               -f "ref=refs/tags/build-$n" -f "sha=${GITHUB_SHA}" >/dev/null; then
            echo "tagged ${GITHUB_SHA} as build-$n"
          else
            # A re-run reaches an existing tag. That is not a release failure, and failing here
            # would leave a shipped build looking unshipped.
            echo "::warning::could not create tag build-$n (it may already exist)"
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/build-$n" --jq '.object.sha' \
              | sed 's/^/build-'"$n"' already points at /'
          fi

      # ── One testable build, as asked ─────────────────────────────────────────────────
      # Processing is asynchronous: the build is not in App Store Connect the moment the upload
      # returns. appstore_connect.py REFUSES to expire anything if it cannot find the build it is
      # meant to protect, so a slow processing run leaves the previous build testable rather than
      # leaving none at all.
      - name: Wait for processing, then expire every other build
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          n=${{ steps.build_number.outputs.n }}
          for i in $(seq 1 40); do
            if "$RUNNER_TEMP/venv/bin/python" Tools/appstore_connect.py expire-others "$n"; then exit 0; fi
            echo "build $n not visible yet (attempt $i/40); waiting 30s"
            sleep 30
          done
          echo "build $n never appeared in App Store Connect within 20 minutes."
          echo "The upload may still be processing. Nothing was expired."
          exit 1

      # ── The changelog, onto the build ────────────────────────────────────────────────
      # `xcrun altool` uploaded the binary and cannot touch this field at all — "What to Test" is
      # a `betaBuildLocalization` hanging off the build, and only the API reaches it. So the
      # upload happens above and the notes come back through the same key everything else here
      # uses.
      #
      # **This step adds no new waiting, and that is the whole reason it sits here.** Processing
      # is asynchronous and can outlast any runner's patience; the honest design would otherwise
      # be a second bounded poll with a second way to time out. But the step above has ALREADY
      # waited for this build to appear — `expire-others` refuses until it can see it — so by the
      # time control reaches this line the build resource exists and the write is one round trip.
      # A build still processing never gets here, because the step above failed first.
      #
      # Which leaves exactly one gap, and it is covered rather than argued away: a build that
      # uploaded but processed too slowly fails the step above, ships to testers anyway once Apple
      # finishes, and carries no notes. `.github/workflows/whats-new-backstop.yml` runs on a
      # schedule, finds any live build whose notes are empty, and stamps it from that build's own
      # tag. The release path is the fast one; the backstop is what makes "every build ships a
      # changelog" true even when the fast path did not finish.
      #
      # Failing loudly here is deliberate. A build in TestFlight with no "What to Test" is the
      # thing the ruling forbids, and a warning would leave it to nobody in particular.
      - name: Publish the release notes to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" Tools/appstore_connect.py set-whats-new \
            "${{ steps.build_number.outputs.n }}" --file "$RUNNER_TEMP/whats-new.txt"


      # ── Always remove the temporary signing keychain ─────────────────────────────────
      # `if: always()` so this runs whether Archive/Export/Tag above succeeded or died partway —
      # a reused runner must never carry this keychain, or the password protecting it, into
      # whatever runs on that machine next. Guarded on the keychain file actually existing:
      # when "Import the signing certificate" above did not run (no persisted certificate
      # configured yet, #232's documented fallback) there is nothing to delete, and
      # `security delete-keychain` on a keychain that was never created would fail and mark this
      # cleanup step red for no reason.
      - name: Remove the temporary signing keychain
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/dist_signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
            echo "deleted $KEYCHAIN_PATH"
          else
            echo "no signing keychain to remove"
          fi
